<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Generator</title>
</head>
<body>

    <h1>Fibonacci Generator 🔢</h1>

    <script>

        function fibonacciGenerator(n) {

            var output = [];

            if (n === 1) {
                output = [0];

            } else if (n === 2) {
                output = [0, 1];

            } else if (n > 2) {

                output = [0, 1];

                for (var i = 2; i < n; i++) {

                    output.push(output[output.length - 2] + output[output.length - 1]);

                }

            }

            return output;

        }

        var numberOfTerms = Number(prompt("How many Fibonacci numbers do you want?"));

        var fibonacciNumbers = fibonacciGenerator(numberOfTerms);

        console.log(fibonacciNumbers);

        alert("Your Fibonacci sequence has been generated! Check the Console.");

    </script>

</body>
</html>
